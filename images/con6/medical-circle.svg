<style>
  .medical-orbit { transform-origin: 360px 360px; animation: medical-orbit-turn 24s linear infinite reverse; }
  .medical-orbit--dashed { animation-duration: 60s; animation-direction: reverse; }
  .medical-orbit-pulse { transform-origin: 360px 155px; animation: medical-orbit-breathe 6s ease-in-out infinite; }
  @keyframes medical-orbit-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.45); } }
  @keyframes medical-orbit-turn { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .medical-orbit, .medical-orbit-pulse { animation: none; } }
</style>
